<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ふよふよタコさん - Fuyofuyo Octopus</title>
  <!-- CSSファイルの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="ui-overlay">
    <div class="header">
      <div class="status-panel">
        <div class="level-badge" id="levelText">ふよふよ Lv.1</div>
        <div class="gauge-container">
          <div class="gauge-bar" id="gaugeBar"></div>
        </div>
        <div class="tap-counter">タップ数: <span id="tapCount">0</span></div>
      </div>

      <button class="sound-btn" id="soundBtn" aria-label="サウンド切り替え">🔊</button>
    </div>

    <div class="fever-banner" id="feverBanner">✨ ふよふよフィーバー！ ✨</div>

    <div class="controls">
      <button class="action-btn" id="feedBtn">
        <span class="btn-icon">🦐</span>
        <span>エサをまく</span>
      </button>
      <button class="action-btn" id="spinBtn">
        <span class="btn-icon">💫</span>
        <span>くるりん</span>
      </button>
      <button class="action-btn" id="inkBtn">
        <span class="btn-icon">💨</span>
        <span>ぷしゅー</span>
      </button>
    </div>
  </div>

  <!-- JavaScriptファイルの読み込み -->
  <script src="script.js"></script>
</body>
</html>
